plugins {
    id 'com.android.application'
    // ⬇️ 重複を解消し、org.jetbrains.kotlin.android のみを残します
    id 'org.jetbrains.kotlin.android'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    id 'kotlin-kapt' // RealmでKaptが必要な場合は残します。ここでは一般的なRealmの設定に合わせます。
    id 'realm-android' // Realmプラグイン
    id 'androidx.navigation.safeargs.kotlin'
}

// アップロード鍵のパスワードは keystore.properties（Git 管理外）から読む。
// ファイルが無い場合は未署名ビルドになる（CI やクリーンチェックアウト用）。
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdk 36
//    buildToolsVersion = '34.0.0'

    defaultConfig {
        applicationId "com.skart.clouding_with_you"
        minSdk 29
        targetSdk 36
        versionCode 8
        versionName "1.6.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        multiDexEnabled true

        // 配信する ABI。Realm のネイティブライブラリが対象。
        // 注: ここで ABI を絞っても 16KB ページサイズ対応にはならない
        //     （必要なのは 16KB アラインメント済みの .so で、Realm 側の対応待ち）
        ndk {
            abiFilters.add("arm64-v8a")
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig = true
    }
    namespace 'com.example.clouding_with_you'
}

dependencies {
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'com.google.android.gms:play-services-ads:24.7.0'

    // Realmはrealm-androidプラグインが設定を処理するため、adapterが不要な場合はコメントアウトを維持
    // implementation 'io.realm:android-adapters:2.1.1'

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.4"

    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.android.gms:play-services-maps:19.2.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'


    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
}